name: Actualización diaria de datos

on:
  schedule:
    - cron: '10 22 * * *' # Actualiza a las 22:10 UTC (19:10 ART)
  workflow_dispatch:

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/reusable-data-update.yml
    with:
      run_command: pnpm run cron diario
      needs_build: true
      env_preset: full
    secrets: inherit
