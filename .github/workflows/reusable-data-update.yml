name: Reusable data update workflow

on:
  workflow_call:
    inputs:
      run_command:
        description: 'Command to run (e.g., pnpm run cron diario)'
        required: true
        type: string
      needs_build:
        description: 'Whether to run pnpm run build before the command'
        required: false
        type: boolean
        default: true
      env_preset:
        description: 'Environment variables preset: full, minimal'
        required: false
        type: string
        default: 'full'
      force_firecrawl:
        description: 'Force Firecrawl execution regardless of day of week'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 22

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Create .env file (minimal)
        if: inputs.env_preset == 'minimal'
        run: |
          touch .env
          echo "VITE_TURSO_DATABASE_URL=${{ secrets.VITE_TURSO_DATABASE_URL }}" >> .env
          echo "VITE_TURSO_AUTH_TOKEN=${{ secrets.VITE_TURSO_AUTH_TOKEN }}" >> .env
          echo "VITE_FIRECRAWL_BASE_URL=${{ secrets.VITE_FIRECRAWL_BASE_URL }}" >> .env
          echo "VITE_FIRECRAWL_API_KEY=${{ secrets.VITE_FIRECRAWL_API_KEY }}" >> .env

      - name: Create .env file (full)
        if: inputs.env_preset == 'full'
        run: |
          touch .env
          echo "VITE_AXIOM_ORG_ID=${{ secrets.VITE_AXIOM_ORG_ID }}" >> .env
          echo "VITE_AXIOM_TOKEN=${{ secrets.VITE_AXIOM_TOKEN }}" >> .env
          echo "VITE_AXIOM_DATASET=${{ secrets.VITE_AXIOM_DATASET }}" >> .env
          echo "VITE_BANXICO_TOKEN=${{ secrets.VITE_BANXICO_TOKEN }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_NEXO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_NEXO_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_NEXO_API_KEY=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_NEXO_API_KEY }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_FIWIND_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_FIWIND_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_LETSBIT_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_LETSBIT_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_BELO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_BELO_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_LEMONCASH_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_LEMONCASH_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_RIPIO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_RIPIO_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_SATOSHITANGO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_SATOSHITANGO_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_LUCAMONEY_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_LUCAMONEY_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_DECRYPTO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_DECRYPTO_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_VESSEO_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_VESSEO_URL }}" >> .env
          echo "VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_URL=${{ secrets.VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_URL }}" >> .env
          echo "VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_CLIENT_ID=${{ secrets.VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_CLIENT_ID }}" >> .env
          echo "VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_CLIENT_SECRET=${{ secrets.VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_CLIENT_SECRET }}" >> .env
          echo "VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_AUDIENCE=${{ secrets.VITE_FINANZAS_PLAZOFIJO_NARANJAX_TOKEN_AUDIENCE }}" >> .env
          echo "VITE_FINANZAS_PLAZOFIJO_NARANJAX_URL=${{ secrets.VITE_FINANZAS_PLAZOFIJO_NARANJAX_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_UALA_TOKEN_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_UALA_TOKEN_URL }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_UALA_USERNAME=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_UALA_USERNAME }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_UALA_PASSWORD=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_UALA_PASSWORD }}" >> .env
          echo "VITE_FINANZAS_RENDIMIENTOS_UALA_URL=${{ secrets.VITE_FINANZAS_RENDIMIENTOS_UALA_URL }}" >> .env
          echo "VITE_CARREFOUR_API_URL=${{ secrets.VITE_CARREFOUR_API_URL }}" >> .env
          echo "VITE_FINANZAS_CRESIUM_URL=${{ secrets.VITE_FINANZAS_CRESIUM_URL }}" >> .env
          echo "VITE_FINANZAS_BELO_CUENTA_REMUNERADA_URL=${{ secrets.VITE_FINANZAS_BELO_CUENTA_REMUNERADA_URL }}" >> .env
          echo "VITE_FINANZAS_CAPYFI_API_URL=${{ secrets.VITE_FINANZAS_CAPYFI_API_URL }}" >> .env
          echo "VITE_FINANZAS_CAPYFI_TOKEN=${{ secrets.VITE_FINANZAS_CAPYFI_TOKEN }}" >> .env
          echo "VITE_FINANZAS_CAPYFI_CHAIN_ID=${{ secrets.VITE_FINANZAS_CAPYFI_CHAIN_ID }}" >> .env
          echo "VITE_FINANZAS_CAPYFI_CTOKEN_ADDRESS=${{ secrets.VITE_FINANZAS_CAPYFI_CTOKEN_ADDRESS }}" >> .env
          echo "VITE_TURSO_DATABASE_URL=${{ secrets.VITE_TURSO_DATABASE_URL }}" >> .env
          echo "VITE_TURSO_AUTH_TOKEN=${{ secrets.VITE_TURSO_AUTH_TOKEN }}" >> .env
          echo "VITE_FINANZAS_CREDITOS_HIPOTECARIOS_UVA_SHEETDB_URL=${{ secrets.VITE_FINANZAS_CREDITOS_HIPOTECARIOS_UVA_SHEETDB_URL }}" >> .env
          echo "VITE_FINANZAS_CREDITOS_HIPOTECARIOS_UVA_SHEETDB_TOKEN=${{ secrets.VITE_FINANZAS_CREDITOS_HIPOTECARIOS_UVA_SHEETDB_TOKEN }}" >> .env
          echo "VITE_FINANZAS_INFLACION_REM_SHEETDB_URL=${{ secrets.VITE_FINANZAS_INFLACION_REM_SHEETDB_URL }}" >> .env
          echo "VITE_FINANZAS_INFLACION_REM_SHEETDB_TOKEN=${{ secrets.VITE_FINANZAS_INFLACION_REM_SHEETDB_TOKEN }}" >> .env
          echo "VITE_GSHEETS_API_KEY=${{ secrets.VITE_GSHEETS_API_KEY }}" >> .env
          echo "VITE_GSHEETS_UALA_SPREADSHEET_ID=${{ secrets.VITE_GSHEETS_UALA_SPREADSHEET_ID }}" >> .env
          echo "VITE_GSHEETS_ASTROPAY_SPREADSHEET_ID=${{ secrets.VITE_GSHEETS_ASTROPAY_SPREADSHEET_ID }}" >> .env
          echo "VITE_GSHEETS_LETRAS_SPREADSHEET_ID=${{ secrets.VITE_GSHEETS_LETRAS_SPREADSHEET_ID }}" >> .env
          echo "VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }}" >> .env
          echo "VITE_TABSTACK_API_KEY=${{ secrets.VITE_TABSTACK_API_KEY }}" >> .env
          echo "VITE_FIRECRAWL_BASE_URL=${{ secrets.VITE_FIRECRAWL_BASE_URL }}" >> .env
          echo "VITE_FIRECRAWL_API_KEY=${{ secrets.VITE_FIRECRAWL_API_KEY }}" >> .env

      - name: Force Firecrawl
        if: inputs.force_firecrawl
        run: echo "VITE_FORCE_FIRECRAWL=true" >> .env

      - name: Install dependencies
        run: pnpm install

      - name: Build
        if: inputs.needs_build
        run: pnpm run build

      - name: Run command
        run: ${{ inputs.run_command }}

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

          git add -A
          timestamp=$(date -u)
          timestampArg=$(date -u -d "3 hours")
          git commit -m "Latest data: ${timestampArg}" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'datos'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
