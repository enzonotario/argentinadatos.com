name: Actualización mensual de datos

on:
  schedule:
    - cron: '10 22 1 * *' # Actualiza a las 22:10 UTC (19:10 ART)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/reusable-data-update.yml
    with:
      run_command: |
        pnpm run cron mensual
        pnpm run cron actualizar-openapi-year
      needs_build: true
      env_preset: full
    secrets: inherit
