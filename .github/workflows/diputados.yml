name: Actualización de datos de Diputados

on:
  schedule:
    - cron: '10 21 * * *' # Actualiza a las 21:10 UTC (18:10 ART)
  workflow_dispatch:

concurrency:
  group: data-update-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/reusable-data-update.yml
    with:
      run_command: pnpm run diputados:test:run
      needs_build: false
      env_preset: minimal
    secrets: inherit
